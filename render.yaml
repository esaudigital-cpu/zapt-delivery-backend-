databases:
  - name: zapt-postgres
    databaseName: zaptdelivery
    user: zaptuser
    plan: free

services:
  - type: web
    name: zapt-delivery-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zapt-postgres
          property: connectionString
